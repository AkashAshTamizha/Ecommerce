version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomxc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecomxc
      POSTGRES_PASSWORD: ecomxc_dev_password
      POSTGRES_DB: ecommerce_inventory
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecomxc']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ecomxc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://ecomxc:ecomxc_dev_password@postgres:5432/ecommerce_inventory?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
    container_name: ecomxc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - '3000:3000'

volumes:
  postgres_data:
